name: Build AniLedger IPA
on:
  push:
    branches: [main]
    tags: ['ios-v*']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      signed:
        description: Export an IPA for devices registered in the distribution profile
        type: boolean
        default: false

permissions:
  contents: read

# One build per push instead of one per commit in the push: the tip is the only
# tree anyone runs, and the tag that publishes a release is built from exactly
# the commit it points at. Pull requests cancel their own superseded runs;
# pushes and tags keep theirs, because a tag run publishes an artifact.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Advisory: reported on every change but not a dependency of the IPA job.
  # Run `xcrun swift-format format --in-place` over the files it lists, then add
  # `format` to the `ipa` job's needs to make it blocking.
  format:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          for xcode in /Applications/Xcode_26*.app; do
            if [[ -d "$xcode/Contents/Developer" ]]; then
              sudo xcode-select -s "$xcode/Contents/Developer"
              xcrun --find swift-format
              exit 0
            fi
          done
          echo "::error::Xcode 26 is required for swift-format."
          exit 1
      - name: Lint changed Swift files
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # Files that predate swift-format and have never been formatted in bulk.
          # Touching one of them used to turn this job red for the whole file.
          # Format one with `xcrun swift-format format --in-place <file>` and take
          # it off this list in the same change.
          UNFORMATTED: ios/AniLedger/TitleScreen.swift
        run: |
          set -euo pipefail
          if [[ -z "${BASE:-}" ]] || [[ "$BASE" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "No base commit to compare against; skipping the format check."
            exit 0
          fi
          files=()
          while IFS= read -r file; do
            if [[ " $UNFORMATTED " == *" $file "* ]]; then
              echo "Not checking $file: it has not been formatted yet."
              continue
            fi
            files+=("$file")
          done < <(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- ios | grep -E '\.swift$' || true)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No Swift changes."
            exit 0
          fi
          printf '%s\n' "${files[@]}"
          xcrun swift-format lint --strict --configuration .swift-format "${files[@]}"

  test:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/AniLedger.xcodeproj/project.pbxproj') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          for xcode in /Applications/Xcode_26*.app; do
            if [[ -d "$xcode/Contents/Developer" ]]; then
              sudo xcode-select -s "$xcode/Contents/Developer"
              xcodebuild -version
              exit 0
            fi
          done
          echo "::error::Xcode 26 is required for the test suite."
          exit 1
      - name: Select an iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          # Pick the newest available iPhone from the runtime list (last match).
          udid=$(xcrun simctl list devices available \
            | sed -nE 's/^[[:space:]]+iPhone.*\(([0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12})\).*/\1/p' \
            | tail -1)
          if [[ -z "$udid" ]]; then
            echo "::error::No available iPhone simulator on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Simulator: $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -project ios/AniLedger.xcodeproj \
            -scheme AniLedger \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }},arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/AniLedgerTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
      - name: Save the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AniLedgerTests-xcresult
          path: ${{ runner.temp }}/AniLedgerTests.xcresult
          if-no-files-found: ignore

  ipa:
    needs: [test]
    # The suite has not proven itself on every change yet, so its result stays
    # advisory until the TESTS_GATE repository variable is "on" (Settings >
    # Secrets and variables > Actions > Variables). That keeps releases from
    # stopping while a red run is still visible in CI. Once the suite is green,
    # set TESTS_GATE=on and a failing suite blocks the IPA and the release.
    if: ${{ !cancelled() && (needs.test.result == 'success' || vars.TESTS_GATE != 'on') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/AniLedger.xcodeproj/project.pbxproj') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          for xcode in /Applications/Xcode_26*.app; do
            if [[ -d "$xcode/Contents/Developer" ]]; then
              sudo xcode-select -s "$xcode/Contents/Developer"
              xcodebuild -version
              xcrun --sdk iphoneos --show-sdk-version
              exit 0
            fi
          done
          echo "::error::Xcode 26 is required for the Liquid Glass build."
          exit 1
      - name: Configure the bundled MyAnimeList iOS Client ID
        # Runs for every build that can be distributed, including a tagged
        # release, and never for a pull request.
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          MAL_IOS_CLIENT_ID: ${{ secrets.MAL_IOS_CLIENT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import plistlib
          import re
          from pathlib import Path

          path = Path("ios/AniLedger/Info.plist")
          with path.open("rb") as source:
              config = plistlib.load(source)
          client_id = os.environ.get("MAL_IOS_CLIENT_ID", "").strip()
          if "AniLedgerMALClientID" in config and client_id:
              if not re.fullmatch(r"[A-Za-z0-9]{32}", client_id):
                  raise SystemExit("MAL_IOS_CLIENT_ID must be a 32-character iOS Client ID.")
              config["AniLedgerMALClientID"] = client_id
              with path.open("wb") as output:
                  plistlib.dump(config, output, sort_keys=False)
          PY
      - name: Build unsigned IPA
        if: ${{ !inputs.signed }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/AniLedger.xcarchive"
          # The commit count makes every build identifiable in Settings > About.
          build=$(git rev-list --count HEAD)
          xcodebuild -project ios/AniLedger.xcodeproj -scheme AniLedger \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$archive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="$build" archive
          test -f "$archive/Products/Applications/AniLedger.app/AniLedger"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$archive/Products/Applications/AniLedger.app" "$RUNNER_TEMP/ipa/Payload/AniLedger.app"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qry "$RUNNER_TEMP/AniLedger-Unsigned.ipa" Payload)
      - name: Sign and export IPA
        if: ${{ inputs.signed }}
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: bash ios/build-signed.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.signed && 'AniLedger-Signed' || 'AniLedger-Unsigned' }}
          path: ${{ runner.temp }}/AniLedger-*.ipa
          if-no-files-found: error
          overwrite: true

  # A release is a tag, not every commit: `git tag ios-v1.0.0 && git push --tags`
  # publishes the IPA built from the tagged tree.
  release:
    needs: [ipa]
    if: startsWith(github.ref, 'refs/tags/ios-v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AniLedger-Unsigned
          path: ${{ runner.temp }}/release-ipa
      - name: Publish the tagged release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ipa="$RUNNER_TEMP/release-ipa/AniLedger-Unsigned.ipa"
          test -f "$ipa"
          if gh release view "$TAG" --json assets > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            if jq -e 'any(.assets[]; .name == "AniLedger-Unsigned.ipa")' "$RUNNER_TEMP/release.json" >/dev/null; then
              echo "The IPA for $TAG is already published."
            else
              gh release upload "$TAG" "$ipa"
            fi
          else
            gh release create "$TAG" "$ipa" \
              --title "AniLedger iOS ${TAG#ios-v}" --verify-tag \
              --notes "Unsigned iOS device build for ${TAG}. Sign the IPA before installing it on an iPhone or iPad."
          fi
