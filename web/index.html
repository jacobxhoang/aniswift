<!doctype html>
<html lang="en" data-type="software" data-radius="soft" data-buttons="solid" data-motion>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1520">
  <meta name="page-type" content="software">
  <meta name="site-kind" content="software">
  <meta name="description" content="Discover anime and manga, track your progress, and connect your MyAnimeList account.">
  <title>AniLedger | Anime and manga tracker</title>
  <meta property="og:title" content="AniLedger">
  <meta property="og:description" content="Track anime and manga with your MyAnimeList account.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2398d6f7'/%3E%3Cpath d='M17 44 30 16h5l13 28h-7l-3-7H26l-3 7zm12-13h6l-3-8z' fill='%230d1520'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="masthead">
    <div class="shell masthead-inner">
      <a class="brand" href="#panel" aria-label="AniLedger home">Ani<span>Ledger</span></a>
        <nav aria-label="Main navigation">
          <a href="#panel" data-nav="panel">My panel</a>
          <a href="#anime" data-nav="anime">Anime</a>
          <a href="#manga" data-nav="manga">Manga</a>
          <a href="#season" data-nav="season">Seasonal</a>
          <a href="#lists" data-nav="lists">My lists</a>
        </nav>
        <form id="search-form" class="search" role="search">
          <label class="sr-only" for="search-kind">Search category</label>
          <select id="search-kind" name="kind"><option value="all">All</option><option value="anime">Anime</option><option value="manga">Manga</option></select>
          <label class="sr-only" for="query">Search anime and manga</label>
          <input id="query" name="q" placeholder="Search anime, manga…" type="search" required maxlength="100" autocomplete="off">
          <button type="submit" class="icon-button" aria-label="Search" data-icon="search"></button>
        </form>
        <div class="header-account" id="header-account"><button type="button" class="button primary" data-action="account">Sign in</button></div>
    </div>
  </header>
  <main id="main" class="shell" tabindex="-1" data-enter>
    <div id="view"></div>
  </main>
  <footer class="shell footer"><a class="footer-brand" href="#panel">AniLedger</a><span>Catalog data from <a href="https://tenrai.org/" target="_blank" rel="noopener">Tenrai</a> and <a href="https://jikan.lucashdo.com" target="_blank" rel="noopener">Jikan Edge</a></span><a href="https://myanimelist.net" target="_blank" rel="noopener">MyAnimeList</a></footer>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-body"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
