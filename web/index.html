<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14111e">
  <meta name="description" content="Discover anime and manga, track your progress, and connect your MyAnimeList account.">
  <title>AniLedger — Anime &amp; Manga Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23c4afff'/%3E%3Cpath d='M34 11 17 35h13l-1 17 18-25H34z' fill='%231b132a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="masthead">
    <div class="shell masthead-inner">
      <a class="brand" href="#panel" aria-label="AniLedger home"><span class="brand-mark" data-icon="bolt"></span><span>Ani<span>Ledger</span></span></a>
      <div class="header-account" id="header-account"><button type="button" class="button primary" data-action="account"><span data-icon="user"></span> Sign in</button></div>
    </div>
    <div class="nav-band">
      <div class="shell nav-inner">
        <nav aria-label="Main navigation">
          <a href="#panel" data-nav="panel"><span data-icon="grid"></span> My Panel</a>
          <a href="#anime" data-nav="anime"><span data-icon="play"></span> Anime</a>
          <a href="#manga" data-nav="manga"><span data-icon="book"></span> Manga</a>
          <a href="#season" data-nav="season"><span data-icon="calendar"></span> Seasonal</a>
          <a href="#lists" data-nav="lists"><span data-icon="list"></span> My Lists</a>
          <a href="#friends" data-nav="friends"><span data-icon="friends"></span> Friends</a>
        </nav>
        <form id="search-form" class="search" role="search">
          <label class="sr-only" for="search-kind">Search category</label>
          <select id="search-kind" name="kind"><option value="all">All</option><option value="anime">Anime</option><option value="manga">Manga</option></select>
          <label class="sr-only" for="query">Search anime and manga</label>
          <input id="query" name="q" placeholder="Search anime, manga…" type="search" required maxlength="100" autocomplete="off">
          <button type="submit" class="icon-button" aria-label="Search" data-icon="search"></button>
        </form>
      </div>
    </div>
  </header>
  <main id="main" class="shell" tabindex="-1">
    <div id="view"></div>
  </main>
  <footer class="shell footer"><a class="footer-brand" href="#panel">AniLedger</a><span>Catalog powered by <a href="https://jikan.lucashdo.com" target="_blank" rel="noopener">jikan-edge</a></span><a href="https://myanimelist.net" target="_blank" rel="noopener">MyAnimeList</a></footer>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-body"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
